# TicketHub web UI. nginx serves the React build and proxies /event-api and
# /booking-api to the two microservices through Kubernetes DNS.
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: tickethub
data:
  EVENT_SERVICE_URL: http://event-service:8081
  BOOKING_SERVICE_URL: http://booking-service:8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tickethub
  labels:
    app: frontend
    app.kubernetes.io/part-of: tickethub
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: tickethub/frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: frontend-config
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tickethub
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
